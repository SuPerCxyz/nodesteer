name: Build and publish Cadentra

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    name: Verify and build binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: web
        run: pnpm run build

      - name: Check frontend formatting
        working-directory: web
        run: pnpm run format:check

      - name: Lint frontend
        working-directory: web
        run: pnpm run lint

      - name: Test Go
        run: go test -buildvcs=false ./...

      - name: Vet Go
        run: go vet -buildvcs=false ./...

      - name: Build Linux binaries
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -buildvcs=false -ldflags='-s -w' -o dist/cadentra-agent-linux-$arch ./cmd/agent
          done
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -buildvcs=false -ldflags='-s -w' -o dist/cadentra-hub-linux-$arch.unbundled ./cmd/hub
            sh packaging/bundle-agent.sh dist/cadentra-hub-linux-$arch dist/cadentra-hub-linux-$arch.unbundled amd64 dist/cadentra-agent-linux-amd64 arm64 dist/cadentra-agent-linux-arm64
            rm dist/cadentra-hub-linux-$arch.unbundled
          done
          sha256sum dist/cadentra-*

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: cadentra-linux-binaries
          path: dist/
          if-no-files-found: error

  publish-images:
    name: Publish ${{ matrix.component }} image
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: hub
            dockerfile: packaging/docker/hub/Dockerfile
          - component: agent
            dockerfile: packaging/docker/agent/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/cadentra-${{ matrix.component }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
