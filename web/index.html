<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      href="/images/nodesteer-logo-square.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>NodeSteer</title>
    <meta name="title" content="NodeSteer" />
    <meta
      name="description"
      content="NodeSteer — Linux infrastructure automation console."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="/" />
    <meta property="og:title" content="NodeSteer" />
    <meta
      property="og:description"
      content="NodeSteer — Linux infrastructure automation console."
    />
    <meta property="og:image" content="/images/nodesteer-logo-original.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="/" />
    <meta property="twitter:title" content="NodeSteer" />
    <meta
      property="twitter:description"
      content="NodeSteer — Linux infrastructure automation console."
    />
    <meta
      property="twitter:image"
      content="/images/nodesteer-logo-original.png"
    />

    <!-- 字体按 @font-face 按需加载，不做无条件 preload。 -->
    <script>
      ;(function () {
        try {
          var m = document.cookie.match(/(?:^|;\s*)font=([^;]+)/)
          var font = m ? m[1] : 'system'
          if (font !== 'system') {
            document.documentElement.classList.add('font-maple')
          }
        } catch (e) {
          document.documentElement.classList.add('font-maple')
        }
      })()
    </script>

    <meta name="theme-color" content="#fff" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
