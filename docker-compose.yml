version: "3.8"

services:
  hub:
    build:
      context: .
      dockerfile: packaging/docker/hub/Dockerfile
    image: nodesteer/hub:latest
    container_name: nodesteer-hub
    restart: unless-stopped
    ports:
      - "${HUB_WEB_PORT:-8080}:8080"
      - "${HUB_GATEWAY_PORT:-8443}:8443"
    environment:
      NODESTEER_WEB_ADDR: ":8080"
      NODESTEER_GATEWAY_ADDR: ":8443"
      NODESTEER_GATEWAY_BASE_URL: "${HUB_GATEWAY_BASE_URL:-}"
      NODESTEER_REGISTRATION_TOKEN: "${REGISTRATION_TOKEN:-changeme}"
      NODESTEER_BASE_URL: "${HUB_BASE_URL:-http://localhost:8080}"
      NODESTEER_DATA_DIR: /var/lib/nodesteer-hub
      NODESTEER_ARTIFACT_DIR: /var/lib/nodesteer-hub/artifacts
      NODESTEER_MAX_FILE_TRANSFER_BYTES: "${MAX_FILE_TRANSFER_BYTES:-10737418240}"
      NODESTEER_ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      NODESTEER_ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}"
      # OIDC SSO（可选，未设置 OIDC_ISSUER 时保持纯本地认证）
      NODESTEER_OIDC_ISSUER: "${OIDC_ISSUER:-}"
      NODESTEER_OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      NODESTEER_OIDC_REDIRECT_URL: "${OIDC_REDIRECT_URL:-}"
      NODESTEER_OIDC_USERNAME_CLAIM: "${OIDC_USERNAME_CLAIM:-}"
      NODESTEER_OIDC_ROLE_CLAIM: "${OIDC_ROLE_CLAIM:-}"
      NODESTEER_OIDC_DEFAULT_ROLE: "${OIDC_DEFAULT_ROLE:-}"
      # 登录方式互斥选择器：true（默认）=本地密码登录，OIDC 完全失效；
      # false=SSO 唯一登录（必须配置 OIDC_ISSUER，密码登录一律 403）
      NODESTEER_OIDC_ALLOW_LOCAL_LOGIN: "${OIDC_ALLOW_LOCAL_LOGIN:-true}"
    volumes:
      - hub-data:/var/lib/nodesteer-hub

  # 可选：Agent（Docker 基础模式）
  agent:
    build:
      context: .
      dockerfile: packaging/docker/agent/Dockerfile
    image: nodesteer/agent:latest
    container_name: nodesteer-agent
    restart: unless-stopped
    depends_on:
      - hub
    environment:
      NODESTEER_HUB_URL: "ws://hub:8443"
      NODESTEER_REGISTRATION_TOKEN: "${REGISTRATION_TOKEN:-changeme}"
      NODESTEER_DEPLOYMENT_MODE: "docker"
      NODESTEER_DATA_DIR: /var/lib/nodesteer
    volumes:
      - agent-data:/var/lib/nodesteer

volumes:
  hub-data:
  agent-data:
