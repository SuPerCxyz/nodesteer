version: "3.8"

services:
  hub:
    build:
      context: .
      dockerfile: packaging/docker/hub/Dockerfile
    image: cadentra/hub:latest
    container_name: cadentra-hub
    restart: unless-stopped
    ports:
      - "${HUB_WEB_PORT:-8080}:8080"
      - "${HUB_GATEWAY_PORT:-8443}:8443"
    environment:
      CADENTRA_WEB_ADDR: ":8080"
      CADENTRA_GATEWAY_ADDR: ":8443"
      CADENTRA_GATEWAY_BASE_URL: "${HUB_GATEWAY_BASE_URL:-}"
      CADENTRA_REGISTRATION_TOKEN: "${REGISTRATION_TOKEN:-changeme}"
      CADENTRA_BASE_URL: "${HUB_BASE_URL:-http://localhost:8080}"
      CADENTRA_DATA_DIR: /var/lib/cadentra-hub
      CADENTRA_ARTIFACT_DIR: /var/lib/cadentra-hub/artifacts
      CADENTRA_MAX_FILE_TRANSFER_BYTES: "${MAX_FILE_TRANSFER_BYTES:-10737418240}"
      CADENTRA_ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      CADENTRA_ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}"
      # OIDC SSO（可选，未设置 OIDC_ISSUER 时保持纯本地认证）
      CADENTRA_OIDC_ISSUER: "${OIDC_ISSUER:-}"
      CADENTRA_OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      CADENTRA_OIDC_REDIRECT_URL: "${OIDC_REDIRECT_URL:-}"
      CADENTRA_OIDC_USERNAME_CLAIM: "${OIDC_USERNAME_CLAIM:-}"
      CADENTRA_OIDC_ROLE_CLAIM: "${OIDC_ROLE_CLAIM:-}"
      CADENTRA_OIDC_DEFAULT_ROLE: "${OIDC_DEFAULT_ROLE:-}"
      # 登录方式互斥选择器：true（默认）=本地密码登录，OIDC 完全失效；
      # false=SSO 唯一登录（必须配置 OIDC_ISSUER，密码登录一律 403）
      CADENTRA_OIDC_ALLOW_LOCAL_LOGIN: "${OIDC_ALLOW_LOCAL_LOGIN:-true}"
    volumes:
      - hub-data:/var/lib/cadentra-hub

  # 可选：Agent（Docker 基础模式）
  agent:
    build:
      context: .
      dockerfile: packaging/docker/agent/Dockerfile
    image: cadentra/agent:latest
    container_name: cadentra-agent
    restart: unless-stopped
    depends_on:
      - hub
    environment:
      CADENTRA_HUB_URL: "ws://hub:8443"
      CADENTRA_REGISTRATION_TOKEN: "${REGISTRATION_TOKEN:-changeme}"
      CADENTRA_DEPLOYMENT_MODE: "docker"
      CADENTRA_DATA_DIR: /var/lib/cadentra
    volumes:
      - agent-data:/var/lib/cadentra

volumes:
  hub-data:
  agent-data:
